apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      volumes:
        - name: html-volume
          configMap:
            name: html-file
      containers:
        - name: nginx
          image: nginx:1.29.6
          volumeMounts:
            - name: html-volume 
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: html-file
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Custom Nginx Page</title>
    </head>
    <body>
      <h1>Hello from ConfigMap!</h1>
      <p>This HTML file is mounted into the nginx container.</p>
    </body>
    </html>